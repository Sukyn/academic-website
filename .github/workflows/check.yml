name: Check website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run check:golf
      - run: npm test
      - run: node tools/circuit-reduction/certify-generated.mjs --check-data
      - run: npm run build
      - run: node tools/quality/weights.mjs
      - name: Check the built website in Chromium
        run: |
          npm install --prefix tmp/quality-tools --no-save --package-lock=false --ignore-scripts axe-core@4.14.0 playwright@1.62.1
          node tmp/quality-tools/node_modules/playwright/cli.js install --with-deps chromium
          node node_modules/astro/bin/astro.mjs preview --host 127.0.0.1 --port 4323 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:4323/ > /dev/null
          npm run test:site:browser
          npm run test:tutorials:browser
          node tools/categorical-circuits/browser.mjs
          npm run test:daily:browser
          npm run test:zx:browser
